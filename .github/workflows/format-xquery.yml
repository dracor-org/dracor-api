name: Check XQuery formatting

on:
  push:
    branches: [main]
    paths:
      - "**.xq"
      - "**.xqm"
      - "**.xql"
      - .prettierrc.json
      - .prettierignore
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/format-xquery.yml
  pull_request:
    paths:
      - "**.xq"
      - "**.xqm"
      - "**.xql"
      - .prettierrc.json
      - .prettierignore
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/format-xquery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
